<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none">
  <rect width="960" height="540" rx="16" fill="#16211D"/>
  <!-- Top Window Bar -->
  <rect x="24" y="20" width="912" height="44" rx="10" fill="#202E29"/>
  <circle cx="46" cy="42" r="5.5" fill="#E06C5A"/>
  <circle cx="64" cy="42" r="5.5" fill="#E5B567"/>
  <circle cx="82" cy="42" r="5.5" fill="#52B788"/>
  <rect x="112" y="31" width="230" height="22" rx="6" fill="#16211D"/>
  <text x="126" y="46" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#B8CEC5">에듀노드 스튜디오 · 2학년 3반 교무실 노드</text>
  <rect x="770" y="31" width="148" height="22" rx="11" fill="#1F6F54"/>
  <circle cx="786" cy="42" r="4" fill="#8CE99A"/>
  <text x="798" y="46" font-family="sans-serif" font-size="11" font-weight="600" fill="#FAF8F4">개인정보 로컬 보호 중</text>

  <!-- Left Sidebar -->
  <rect x="24" y="78" width="196" height="438" rx="12" fill="#1D2A25"/>
  <rect x="38" y="96" width="168" height="34" rx="8" fill="#1F6F54"/>
  <text x="54" y="118" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#FAF8F4">오늘의 수업·상담 브리핑</text>
  <rect x="38" y="140" width="168" height="34" rx="8" fill="#263630"/>
  <text x="54" y="162" font-family="sans-serif" font-size="12" fill="#C7D8D0">교사 승인 대기함 (3)</text>
  <rect x="38" y="184" width="168" height="34" rx="8" fill="#263630"/>
  <text x="54" y="206" font-family="sans-serif" font-size="12" fill="#C7D8D0">학급 기억장 · 루브릭</text>
  <rect x="38" y="228" width="168" height="34" rx="8" fill="#263630"/>
  <text x="54" y="250" font-family="sans-serif" font-size="12" fill="#C7D8D0">LMS·알림장 상시 모니터</text>
  <rect x="38" y="446" width="168" height="54" rx="8" fill="#16211D"/>
  <text x="50" y="468" font-family="sans-serif" font-size="10.5" fill="#8FA89D">이번 달 AI 예산 가드레일</text>
  <rect x="50" y="478" width="144" height="7" rx="3.5" fill="#2B3D36"/>
  <rect x="50" y="478" width="42" height="7" rx="3.5" fill="#52B788"/>

  <!-- Center Briefing Panel -->
  <rect x="236" y="78" width="424" height="438" rx="12" fill="#FAF8F4"/>
  <rect x="260" y="102" width="118" height="24" rx="12" fill="#E6F3EE"/>
  <text x="319" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1F6F54">08:10 자동 준비 완료</text>
  <text x="260" y="152" font-family="sans-serif" font-size="19" font-weight="800" fill="#18201D">화요일 아침 수업 &amp; 학부모 상담 브리핑</text>
  <rect x="260" y="170" width="376" height="1" fill="#E2DDD2"/>
  <text x="260" y="198" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F6F54">1. 3교시 문학 수행평가 미제출 현황 (Google Classroom)</text>
  <rect x="260" y="210" width="376" height="58" rx="8" fill="#EFEADD"/>
  <text x="276" y="233" font-family="sans-serif" font-size="12" fill="#2D3833">• 28명 중 25명 제출 완료 · 미제출 3명 개별 독려 초안 대기 중</text>
  <text x="276" y="253" font-family="sans-serif" font-size="12" fill="#4A5550">• 루브릭 기준 3단계 자기평가 체크리스트 첨부 확인됨</text>

  <text x="260" y="298" font-family="sans-serif" font-size="12" font-weight="700" fill="#D96B43">2. 16:00 김하늘 학생 학부모 진로 상담 요약</text>
  <rect x="260" y="310" width="376" height="84" rx="8" fill="#FDF0EA"/>
  <text x="276" y="334" font-family="sans-serif" font-size="12" fill="#2D3833">• 지난 학기 상담 메모: 발표 긴장도가 높으나 글쓰기 역량 우수</text>
  <text x="276" y="354" font-family="sans-serif" font-size="12" fill="#2D3833">• 학부모 사전 질문(알림장): 미디어학부 학생부 세특 방향 문의</text>
  <text x="276" y="374" font-family="sans-serif" font-size="12" font-weight="600" fill="#9C4120">→ 권장 질문 2건 및 포트폴리오 예시 자료 폴더 연결됨</text>

  <rect x="260" y="416" width="376" height="76" rx="8" fill="#FFFFFF" stroke="#DDD7C8"/>
  <text x="276" y="442" font-family="sans-serif" font-size="12" font-weight="700" fill="#18201D">교무 행정 알림 · 교육청 공문 요약</text>
  <text x="276" y="464" font-family="sans-serif" font-size="11.5" fill="#4A5550">디지털 선도학교 교원 연수 신청 마감 D-2 (금요일 17:00)</text>

  <!-- Right Trust Approval Card -->
  <rect x="676" y="78" width="260" height="438" rx="12" fill="#F3EFE6"/>
  <rect x="696" y="102" width="110" height="24" rx="6" fill="#FDF0EA"/>
  <text x="751" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#D96B43">교사 승인 필요</text>
  <text x="696" y="150" font-family="sans-serif" font-size="15" font-weight="800" fill="#18201D">학부모 회신 초안 검토</text>
  <rect x="696" y="168" width="220" height="176" rx="10" fill="#FFFFFF" stroke="#DED8CA"/>
  <text x="710" y="192" font-family="sans-serif" font-size="11" font-weight="700" fill="#63706A">수신: 김하늘 학부모님 (하이클래스)</text>
  <text x="710" y="218" font-family="sans-serif" font-size="11.5" fill="#2D3833">안녕하세요 어머니, 오늘 오후 4시</text>
  <text x="710" y="238" font-family="sans-serif" font-size="11.5" fill="#2D3833">상담에서 하늘이의 독서·비평 활동</text>
  <text x="710" y="258" font-family="sans-serif" font-size="11.5" fill="#2D3833">기록을 바탕으로 세특 방향을 함께</text>
  <text x="710" y="278" font-family="sans-serif" font-size="11.5" fill="#2D3833">안내드리겠습니다. 2층 상담실에서</text>
  <text x="710" y="298" font-family="sans-serif" font-size="11.5" fill="#2D3833">뵙겠습니다.</text>
  <rect x="696" y="362" width="220" height="40" rx="8" fill="#1F6F54"/>
  <text x="806" y="387" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">검토 완료 · 발송 승인</text>
  <rect x="696" y="412" width="220" height="36" rx="8" fill="#FFFFFF" stroke="#CFC8B8"/>
  <text x="806" y="435" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#4A5550">문구 직접 수정</text>
</svg>
